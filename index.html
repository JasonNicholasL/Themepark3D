<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎡 Themepark 3D</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background: #0a0010;
            font-family: 'Nunito', sans-serif;
            color: white;
        }

        /* ── BLOCKER / MENU UTAMA ── */
        #blocker {
            position: absolute; inset: 0;
            z-index: 999;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: radial-gradient(ellipse at center, #1a003a 0%, #000010 100%);
        }

        #blocker h1 {
            font-family: 'Boogaloo', cursive;
            font-size: clamp(2rem, 6vw, 4rem);
            color: #ffe438;
            text-shadow: 0 0 30px #ff6a00, 0 0 60px #ff6a00;
            letter-spacing: 4px;
            margin-bottom: 8px;
            animation: titlePulse 2s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% { text-shadow: 0 0 30px #ff6a00, 0 0 60px #ff6a00; }
            50%  { text-shadow: 0 0 50px #ff00aa, 0 0 100px #ff00aa; }
        }

        #playBtn {
            margin-top: 32px;
            font-family: 'Boogaloo', cursive;
            font-size: 1.6rem;
            letter-spacing: 3px;
            padding: 16px 48px;
            border: 3px solid #ffe438;
            background: transparent;
            color: #ffe438;
            border-radius: 50px;
            cursor: pointer;
            transition: all .25s;
            text-transform: uppercase;
        }
        #playBtn:hover {
            background: #ffe438;
            color: #1a003a;
            box-shadow: 0 0 40px #ffe438;
            transform: scale(1.05);
        }

        #hints {
            margin-top: 20px;
            font-size: .95rem;
            color: rgba(255,255,255,.6);
            text-align: center;
            line-height: 1.9;
        }
        #hints strong { color: #ffe438; }

        /* ── DEKORASI LAMPU BLOCKER ── */
        .light-row {
            display: flex; gap: 12px;
            margin-bottom: 24px;
        }
        .bulb {
            width: 16px; height: 16px;
            border-radius: 50%;
            animation: blinkBulb 1.2s steps(1) infinite;
        }
        .bulb:nth-child(odd)  { background: #ff5050; animation-delay: 0s; }
        .bulb:nth-child(even) { background: #ffe438; animation-delay: .6s; }
        @keyframes blinkBulb { 0%,49% { opacity:1; } 50%,100% { opacity:.15; } }

        /* ── HUD DALAM GAME ── */
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            font-size: 28px; color: rgba(255,255,255,.75);
            z-index: 100; pointer-events: none;
            display: none; user-select: none;
        }

        #hud {
            position: absolute; top: 14px; left: 50%;
            transform: translateX(-50%);
            z-index: 100; pointer-events: none;
            display: none;
            font-family: 'Boogaloo', cursive;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #ffe438;
            text-shadow: 0 0 12px #ff6a00;
        }

        #tooltip {
            position: absolute; bottom: 60px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,.7);
            border: 1px solid #ffe438;
            border-radius: 8px;
            padding: 8px 20px;
            font-size: .9rem;
            color: #ffe438;
            z-index: 100; pointer-events: none;
            display: none;
            letter-spacing: 1px;
        }

        #controls-hint {
            position: absolute; bottom: 14px; left: 50%;
            transform: translateX(-50%);
            font-size: .78rem;
            color: rgba(255,255,255,.4);
            z-index: 100; pointer-events: none;
            display: none;
            letter-spacing: 1px;
        }

        #mode-indicator {
            position: absolute; top: 14px; right: 14px;
            z-index: 100; pointer-events: none;
            display: none;
            font-size: .9rem;
            color: #ffe438;
            font-family: 'Boogaloo', cursive;
            letter-spacing: 1px;
            text-shadow: 0 0 12px #ff6a00;
        }
    </style>
</head>
<body>

<!-- ── MENU UTAMA ── -->
<div id="blocker">
    <div class="light-row">
        <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
        <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
        <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
        <div class="bulb"></div>
    </div>
    <h1>🎡 Themepark</h1>
    <!-- <p style="color:rgba(255,255,255,.5);font-size:.95rem;letter-spacing:2px;">CARNIVAL WORLD 3D</p> -->
    <button id="playBtn">▶ Enter the Themepark</button>
    <div id="hints">
        <strong>W A S D</strong>&nbsp; to Move &nbsp;|&nbsp;
        <strong>Mouse</strong> = Menoleh<br>
        <strong>ESC</strong> = Exit &nbsp;|&nbsp;
        <strong>Klik</strong>&nbsp; to Interact
    </div>
    <div class="light-row" style="margin-top:24px;margin-bottom:0">
        <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
        <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
        <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
        <div class="bulb"></div>
    </div>
</div>

<!-- ── HUD ── -->
<div id="crosshair">.</div>
<div id="hud">🎡 Themepark
</div>
<div id="tooltip"></div>
<div id="mode-indicator"></div>
<div id="controls-hint">W A S D = Jalan &nbsp;|&nbsp; Mouse = Lihat &nbsp;|&nbsp; ESC = Menu &nbsp;|&nbsp; SPACE = Lompat &nbsp;|&nbsp; H = Mode Bebas</div>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
// ════════════════════════════════════════════════════════
//  SETUP DASAR
// ════════════════════════════════════════════════════════
const scene    = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
// scene.fog = new THREE.Fog(0x100020, 30, 120);

const camera   = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 1.7, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.toneMapping       = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

// ════════════════════════════════════════════════════════
//  POINTER LOCK CONTROLS
// ════════════════════════════════════════════════════════
const controls = new THREE.PointerLockControls(camera, document.body);
scene.add(controls.getObject());

const blocker       = document.getElementById('blocker');
const crosshair     = document.getElementById('crosshair');
const hud           = document.getElementById('hud');
const tooltip       = document.getElementById('tooltip');
const controlsHint  = document.getElementById('controls-hint');
const modeIndicator = document.getElementById('mode-indicator');
const playBtn       = document.getElementById('playBtn');

playBtn.addEventListener('click', () => controls.lock());
controls.addEventListener('lock',   () => {
    blocker.style.display = 'none';
    crosshair.style.display = 'block';
    hud.style.display = 'block';
    controlsHint.style.display = 'block';
    modeIndicator.style.display = 'block';
});
controls.addEventListener('unlock', () => {
    blocker.style.display = 'flex';
    crosshair.style.display = 'none';
    hud.style.display = 'none';
    tooltip.style.display = 'none';
    controlsHint.style.display = 'none';
    modeIndicator.style.display = 'none';
    isFreeRoamMode = false;
});

// ════════════════════════════════════════════════════════
//  INPUT KEYBOARD
// ════════════════════════════════════════════════════════
const keys = { w:false, a:false, s:false, d:false, space:false, ctrl:false };
let isFreeRoamMode = false;
let jumpVelocity = 0;
const GRAVITY = 0.01;
const JUMP_FORCE = 0.2;
const GROUND_LEVEL = 1.7;

document.addEventListener('keydown', e => {
    if (e.code==='KeyW') keys.w=true;
    if (e.code==='KeyA') keys.a=true;
    if (e.code==='KeyS') keys.s=true;
    if (e.code==='KeyD') keys.d=true;
    if (e.code==='Space') {
        e.preventDefault();
        keys.space=true;
        // Jump only if in normal mode and on ground
        if (!isFreeRoamMode && camera.position.y <= GROUND_LEVEL + 0.01) {
            jumpVelocity = JUMP_FORCE;
        }
    }
    if (e.code==='ControlLeft' || e.code==='ControlRight') keys.ctrl=true;
    if (e.code==='KeyH') {
        isFreeRoamMode = !isFreeRoamMode;
        jumpVelocity = 0;
    }
});
document.addEventListener('keyup', e => {
    if (e.code==='KeyW') keys.w=false;
    if (e.code==='KeyA') keys.a=false;
    if (e.code==='KeyS') keys.s=false;
    if (e.code==='KeyD') keys.d=false;
    if (e.code==='Space') keys.space=false;
    if (e.code==='ControlLeft' || e.code==='ControlRight') keys.ctrl=false;
});

// ════════════════════════════════════════════════════════
//  SISTEM KOLISI (AABB sederhana)
// ════════════════════════════════════════════════════════
// Setiap objek kolisi disimpan sebagai { cx, cz, rx, rz, label }
const colliders = [];

function addCollider(cx, cz, rx, rz, label='') {
    colliders.push({ cx, cz, rx, rz, label });
}

const PLAYER_R = 0.5; // radius silinder pemain

function resolveCollision(pos) {
    for (const c of colliders) {
        const dx = pos.x - c.cx;
        const dz = pos.z - c.cz;
        const ox = c.rx + PLAYER_R - Math.abs(dx);
        const oz = c.rz + PLAYER_R - Math.abs(dz);
        if (ox > 0 && oz > 0) {
            if (ox < oz) pos.x += dx < 0 ? -ox : ox;
            else         pos.z += dz < 0 ? -oz : oz;
        }
    }
}

// ════════════════════════════════════════════════════════
//  HELPER WARNA STRIPE / POLA KANVAS
// ════════════════════════════════════════════════════════
function makeStripeTexture(c1='#ff3366', c2='#ffffff', stripes=8, size=256) {
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    const sw = size / stripes;
    for (let i = 0; i < stripes; i++) {
        ctx.fillStyle = i % 2 === 0 ? c1 : c2;
        ctx.fillRect(i * sw, 0, sw, size);
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
}

function makeCheckerTexture(c1='#cc0033', c2='#ffe438', size=256, tiles=8) {
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    const s = size / tiles;
    for (let y = 0; y < tiles; y++) for (let x = 0; x < tiles; x++) {
        ctx.fillStyle = (x+y)%2===0 ? c1 : c2;
        ctx.fillRect(x*s, y*s, s, s);
    }
    return new THREE.CanvasTexture(canvas);
}

function makeLightBulbTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#111';
    ctx.fillRect(0,0,64,64);
    ctx.fillStyle = '#ffe438';
    ctx.beginPath(); ctx.arc(32,32,14,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(26,26,4,0,Math.PI*2); ctx.fill();
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
}

function makeGroundTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#3a2508';
    ctx.fillRect(0,0,512,512);
    // sawdust grain
    for (let i = 0; i < 8000; i++) {
        const x = Math.random()*512, y = Math.random()*512;
        const l = Math.random()*8+2;
        ctx.strokeStyle = `rgba(${180+Math.random()*40|0},${130+Math.random()*30|0},60,0.4)`;
        ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+l,y+l*0.3); ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(20,20);
    return tex;
}

// ════════════════════════════════════════════════════════
//  PENCAHAYAAN
// ════════════════════════════════════════════════════════
// Ambien redup — suasana malam karnaval
const ambientLight = new THREE.AmbientLight(0x221133, 0.8);
scene.add(ambientLight);

// Lampu directional (bulan)
const moonLight = new THREE.DirectionalLight(0x8899ff, 0.5);
moonLight.position.set(-20, 40, -20);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.near = 1;
moonLight.shadow.camera.far  = 150;
moonLight.shadow.camera.left = moonLight.shadow.camera.bottom = -60;
moonLight.shadow.camera.right = moonLight.shadow.camera.top   =  60;
scene.add(moonLight);

// ════════════════════════════════════════════════════════
//  TANAH & PAGAR BATAS
// ════════════════════════════════════════════════════════
const floorGeo  = new THREE.PlaneGeometry(200, 200);
const floorMat  = new THREE.MeshStandardMaterial({ map: makeGroundTexture(), roughness:1, metalness:0 });
const floor     = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

// Pagar batas area (kolisi dinding tak terlihat)
const BOUNDARY = 35;
addCollider(0,  BOUNDARY, BOUNDARY, 2, 'pagar-utara');
addCollider(0, -BOUNDARY, BOUNDARY, 2, 'pagar-selatan');
addCollider( BOUNDARY, 0, 2, BOUNDARY, 'pagar-timur');
addCollider(-BOUNDARY, 0, 2, BOUNDARY, 'pagar-barat');

// ════════════════════════════════════════════════════════
//  LANGIT — BINTANG PROSEDURAL
// ════════════════════════════════════════════════════════
(function buildStars() {
    const geo = new THREE.BufferGeometry();
    const count = 2000;
    const pos = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi   = Math.acos(2 * Math.random() - 1);
        const r     = 180 + Math.random() * 20;
        pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
        pos[i*3+1] = r * Math.cos(phi);
        pos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, sizeAttenuation: true });
    scene.add(new THREE.Points(geo, mat));
})();

// ════════════════════════════════════════════════════════
//  LAMPU JALAN DEKORATIF
// ════════════════════════════════════════════════════════
const lampColors = [0xff4466, 0x44ffaa, 0xffe438, 0x44aaff, 0xff88ff];
function makeLampPost(x, z, colorHex) {
    const group = new THREE.Group();

    // tiang
    const poleGeo = new THREE.CylinderGeometry(0.05, 0.08, 4, 8);
    const poleMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness:0.6, roughness:0.4 });
    const pole = new THREE.Mesh(poleGeo, poleMat);
    pole.position.y = 2;
    pole.castShadow = true;
    group.add(pole);

    // lampu
    const bulbGeo = new THREE.SphereGeometry(0.22, 12, 8);
    const bulbMat = new THREE.MeshStandardMaterial({
        color: colorHex,
        emissive: colorHex,
        emissiveIntensity: 2,
        roughness: 0.2
    });
    const bulb = new THREE.Mesh(bulbGeo, bulbMat);
    bulb.position.y = 4.2;
    group.add(bulb);

    // point light
    const light = new THREE.PointLight(colorHex, 1.5, 14);
    light.position.y = 4.2;
    light.castShadow = false;
    group.add(light);

    group.position.set(x, 0, z);
    scene.add(group);
}

// Lampu di sepanjang jalur utama
for (let i = -3; i <= 3; i++) {
    makeLampPost(-5,  i * 8, lampColors[Math.abs(i) % lampColors.length]);
    makeLampPost( 5,  i * 8, lampColors[(Math.abs(i)+2) % lampColors.length]);
}
// Lampu di pintu masuk
makeLampPost(-6, 20, 0xffe438);
makeLampPost( 6, 20, 0xffe438);

// ════════════════════════════════════════════════════════
//  PINTU GERBANG KARNAVAL
// ════════════════════════════════════════════════════════
(function buildGate() {
    const mat = new THREE.MeshStandardMaterial({
        map: makeStripeTexture('#cc0033','#ffffff', 6),
        roughness: 0.7
    });

    // tiang kiri & kanan
    const pillarGeo = new THREE.CylinderGeometry(0.4, 0.4, 8, 12);
    const left = new THREE.Mesh(pillarGeo, mat);
    left.position.set(-5, 4, 22); left.castShadow = true; scene.add(left);
    const right = new THREE.Mesh(pillarGeo, mat);
    right.position.set( 5, 4, 22); right.castShadow = true; scene.add(right);

    // lengkung atas
    const archGeo  = new THREE.TorusGeometry(5, 0.4, 8, 32, Math.PI);
    const archMesh = new THREE.Mesh(archGeo, mat);
    archMesh.position.set(0, 8, 22);
    archMesh.rotation.z = Math.PI;
    archMesh.castShadow = true;
    scene.add(archMesh);

    // papan nama
    const signGeo = new THREE.BoxGeometry(7, 1.5, 0.2);
    const signMat = new THREE.MeshStandardMaterial({
        color: 0xffe438, emissive: 0xffaa00, emissiveIntensity: 0.4
    });
    const sign = new THREE.Mesh(signGeo, signMat);
    sign.position.set(0, 9.5, 22);
    sign.castShadow = true;
    scene.add(sign);

    // kolisi gerbang (hanya tiangnya)
    addCollider(-5, 22, 0.5, 0.5, 'gerbang-kiri');
    addCollider( 5, 22, 0.5, 0.5, 'gerbang-kanan');
})();

// ════════════════════════════════════════════════════════
//  🎡 BIANGLALA (FERRIS WHEEL)
//  ── animasi: berputar pada sumbu Z lokal
// ════════════════════════════════════════════════════════
// const dracoLoader = new DRACOLoader();
// dracoLoader.setDecoderPath( '/examples/jsm/libs/draco/' );
// loader.setDRACOLoader( dracoLoader );
// const gltf = await loader.loadAsync( 'models/Ferriswheel/scene.gltf' );

// ── Ferriswheel loaded from models directory ──
// Placeholder removed — model loaded via gltfLoader below

// ════════════════════════════════════════════════════════
//  🎠 KOMEDI PUTAR (CAROUSEL / MERRY-GO-ROUND)
//  ── animasi: berputar pada sumbu Y
// ════════════════════════════════════════════════════════
const carouselGroup = new THREE.Group();

(function buildCarousel() {
    // Alas platform
    const baseGeo = new THREE.CylinderGeometry(4.2, 4.2, 0.3, 32);
    const baseMat = new THREE.MeshStandardMaterial({
        map: makeCheckerTexture('#cc0033','#ffe438'),
        roughness: 0.7
    });
    const base = new THREE.Mesh(baseGeo, baseMat);
    base.position.y = 0.15;
    base.receiveShadow = true;
    base.castShadow   = true;
    carouselGroup.add(base);

    // Tiang tengah
    const centerGeo = new THREE.CylinderGeometry(0.2, 0.2, 5.5, 12);
    const centerMat = new THREE.MeshStandardMaterial({
        map: makeStripeTexture('#ff3366','#ffffff', 10),
        roughness: 0.5
    });
    const center = new THREE.Mesh(centerGeo, centerMat);
    center.position.y = 3;
    center.castShadow = true;
    carouselGroup.add(center);

    // Atap kerucut
    const roofGeo = new THREE.ConeGeometry(5.2, 2.5, 32);
    const roofMat = new THREE.MeshStandardMaterial({
        map: makeStripeTexture('#cc0033','#ffffff', 12),
        roughness: 0.6
    });
    const roof = new THREE.Mesh(roofGeo, roofMat);
    roof.position.y = 6.8;
    roof.castShadow = true;
    carouselGroup.add(roof);

    // Bola puncak
    const topBall = new THREE.Mesh(
        new THREE.SphereGeometry(0.35, 12, 8),
        new THREE.MeshStandardMaterial({ color:0xffe438, emissive:0xffaa00, emissiveIntensity:1 })
    );
    topBall.position.y = 8.2;
    carouselGroup.add(topBall);

    // Tiang kuda & kuda (balok sederhana)
    const HORSES = 6;
    for (let i = 0; i < HORSES; i++) {
        const angle = (i / HORSES) * Math.PI * 2;
        const r = 3;
        const x = Math.sin(angle) * r;
        const z = Math.cos(angle) * r;

        // Tiang kuda
        const poleGeo = new THREE.CylinderGeometry(0.06, 0.06, 3.5, 8);
        const poleMat = new THREE.MeshStandardMaterial({ color: lampColors[i % lampColors.length], metalness:0.4 });
        const poleM   = new THREE.Mesh(poleGeo, poleMat);
        poleM.position.set(x, 2.2, z);
        carouselGroup.add(poleM);

        // Badan kuda (kotak sederhana)
        const bodyGeo = new THREE.BoxGeometry(0.5, 0.7, 1.1);
        const bodyMat = new THREE.MeshStandardMaterial({
            color: [0xffffff,0xffbb88,0x88bbff,0xff9999,0x99ff99,0xffff88][i % 6],
            roughness: 0.6
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.set(x, 1.4 + Math.sin(i) * 0.3, z);
        body.castShadow = true;
        carouselGroup.add(body);

        // Kepala kuda
        const headGeo = new THREE.BoxGeometry(0.35, 0.35, 0.4);
        const head = new THREE.Mesh(headGeo, bodyMat);
        head.position.set(x, 1.9 + Math.sin(i)*0.3, z + 0.65);
        head.rotation.x = -0.4;
        head.castShadow = true;
        carouselGroup.add(head);

        // Lampu hias di tiang
        const lampGeo = new THREE.SphereGeometry(0.12, 8, 6);
        const lampMat = new THREE.MeshStandardMaterial({
            color: lampColors[i % lampColors.length],
            emissive: lampColors[i % lampColors.length],
            emissiveIntensity: 1.5
        });
        const lamp = new THREE.Mesh(lampGeo, lampMat);

(function buildStringLights() {
    const bulbGeo = new THREE.SphereGeometry(0.12, 6, 4);

        for (let i = 0; i <= count; i++) {
            const t = i / count;
            const x = p1[0] + (p2[0]-p1[0])*t;
            const z = p1[1] + (p2[1]-p1[1])*t;
            const sag = Math.sin(t * Math.PI) * -1.5;

            const b = new THREE.Mesh(bulbGeo, mat);
            b.position.set(x, y, z);
            scene.add(b);
        }
    }

    // Rangkaian lampu sepanjang jalan utama
    makeString([-5,20],[-5,-20], 18);
    makeString([ 5,20],[ 5,-20], 18);
    makeString([-5,8],[5,8], 8);
    makeString([-5,0],[5,0], 8);
    makeString([-5,-8],[5,-8], 8);
})();

const gltfLoader = new THREE.GLTFLoader();
let ferrisGroup; // Store reference for animation
let ferrisWheel; // Store reference to the wheel mesh for rotation
let ferrisCabin; // Store reference to the cabin parent node
let cabins = []; // Store individual cabin nodes
let ferrisRotationAngle = 0; // Track total rotation angle
const CABIN_RADIUS = 10; // Distance from wheel center

// Helper function to update cabin position based on angle
function updateCabin(cabinMesh, angle) {
    const cx = ferrisGroup.position.x;
    const cy = ferrisGroup.position.y;
    cabinMesh.position.set(
        cx + Math.cos(angle) * CABIN_RADIUS,
        cy + Math.sin(angle) * CABIN_RADIUS,
        ferrisGroup.position.z
    );
    ferrisGroup.traverse(node => {
        if (node.isMesh) { 
            node.castShadow = true; 
            node.receiveShadow = true; 
            // Find and store the wheel mesh for rotation
            if (node.name.includes('wheel')) {
                ferrisWheel = node;
            }
        }
        // Find and store the cabin group for rotation
        if (node.name === 'cabin') {
            ferrisCabin = node;
            // Store each cabin child with its initial angle
            node.children.forEach((cabin, index) => {
                const initialAngle = (index / node.children.length) * Math.PI * 2;
                cabins.push({
                    mesh: cabin,
                    initialAngle: initialAngle
                });
            });
        }
    });
}

// ════════════════════════════════════════════════════════
//  RAYCASTING (INTERAKSI KLIK)
// ════════════════════════════════════════════════════════
const raycaster    = new THREE.Raycaster();
const centerScreen = new THREE.Vector2(0, 0);

const objectLabels = new Map();
scene.traverse(obj => {
    if (obj.isMesh && obj.parent?.userData?.label) {
        objectLabels.set(obj, obj.parent.userData.label);
    }
});

document.addEventListener('mousedown', () => {
    if (!controls.isLocked) return;
    raycaster.setFromCamera(centerScreen, camera);
    const hits = raycaster.intersectObjects(scene.children, true);
    if (hits.length > 0) {
        const mesh = hits[0].object;
        if (mesh.isMesh) {
            // Flash effect
            const origEmissive = mesh.material.emissive?.getHex?.() ?? 0;
            mesh.material.emissive?.setHex(0xffffff);
            setTimeout(() => mesh.material.emissive?.setHex(origEmissive), 120);
        }
    }
});

// ════════════════════════════════════════════════════════
//  CLOCK & ANIMASI VARIABEL
// ════════════════════════════════════════════════════════
const clock = new THREE.Clock();

// ════════════════════════════════════════════════════════
//  LOOP ANIMASI UTAMA
// ════════════════════════════════════════════════════════
function animate() {
    requestAnimationFrame(animate);

    const elapsed = clock.getElapsedTime();
    const delta   = clock.getDelta ? 0.016 : 0.016; // fallback

    // ── Bianglala (wheel) berputar dan cabins orbit ──
    if (ferrisWheel) {
        ferrisWheel.rotation.z += 0.003;
        ferrisRotationAngle += 0.003;
    }
    // Update cabin positions to orbit around wheel center
    cabins.forEach((cabin) => {
        const currentAngle = cabin.initialAngle + ferrisRotationAngle;
        updateCabin(cabin.mesh, currentAngle);
    });

    // ── Komedi putar berputar ──
    carouselGroup.rotation.y += 0.008;

    // ── Ayunan swing berayun + berputar ──
    swingGroup.rotation.y += 0.006;
    const swingLean = Math.sin(elapsed * 0.8) * 0.22;
    swingSeats.forEach((seat, i) => {
        seat.rotation.z = swingLean;
    });

    // ── Perahu bajak laut berayun ──
    shipAngle = Math.sin(elapsed * 0.7) * 0.45;
    pirateShipGroup.rotation.z = shipAngle;

    // ── Balon melayang (naik turun) ──
    scene.traverse(obj => {
        if (obj.isMesh && obj.userData.floatOffset !== undefined) {
            obj.position.y += Math.sin(elapsed * 1.5 + obj.userData.floatOffset) * 0.002;
        }
    });

    // ── Pergerakan kamera (WASD + kolisi) ──
    if (controls.isLocked) {
        const speed = 0.1;
        
        if (isFreeRoamMode) {
            // Free roam mode: move in all directions
            if (keys.w) controls.moveForward( speed);
            if (keys.s) controls.moveForward(-speed);
            if (keys.d) controls.moveRight( speed);
            if (keys.a) controls.moveRight(-speed);
            
            // Vertical movement with SPACE and CTRL
            if (keys.space) camera.position.y += 0.08;
            if (keys.ctrl) camera.position.y -= 0.08;
            
            // Update mode indicator
            modeIndicator.textContent = '📡 MODE BEBAS';
            modeIndicator.style.color = '#44ff99';
            
            // No collision in free roam
        } else {
            // Normal walking mode with jump
            if (keys.w) controls.moveForward( speed);
            if (keys.s) controls.moveForward(-speed);
            if (keys.d) controls.moveRight( speed);
            if (keys.a) controls.moveRight(-speed);

            // Apply gravity and jump
            jumpVelocity -= GRAVITY;
            camera.position.y += jumpVelocity;
            
            // Ground collision
            if (camera.position.y <= GROUND_LEVEL) {
                camera.position.y = GROUND_LEVEL;
                jumpVelocity = 0;
            }
            
            // Update mode indicator
            modeIndicator.textContent = '🚶 MODE NORMAL';
            modeIndicator.style.color = '#ffe438';
            
            // Kolisi dengan dunia
            resolveCollision(camera.position);
        }
    }

    renderer.render(scene, camera);
}

animate();

// ════════════════════════════════════════════════════════
//  RESIZE
// ════════════════════════════════════════════════════════
window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
