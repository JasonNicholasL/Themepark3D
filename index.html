<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background: #0a0010;
            font-family: 'Nunito', sans-serif;
            color: white;
        }

        /* ── BLOCKER / MENU UTAMA ── */
        #blocker {
            position: absolute; inset: 0;
            z-index: 999;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: radial-gradient(ellipse at center, #1a003a 0%, #000010 100%);
        }

        #blocker h1 {
            font-family: 'Boogaloo', cursive;
            font-size: clamp(2rem, 6vw, 4rem);
            color: #ffe438;
            text-shadow: 0 0 30px #ff6a00, 0 0 60px #ff6a00;
            letter-spacing: 4px;
            margin-bottom: 8px;
            animation: titlePulse 2s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% { text-shadow: 0 0 30px #ff6a00, 0 0 60px #ff6a00; }
            50%  { text-shadow: 0 0 50px #ff00aa, 0 0 100px #ff00aa; }
        }

        #playBtn {
            margin-top: 32px;
            font-family: 'Boogaloo', cursive;
            font-size: 1.6rem;
            letter-spacing: 3px;
            padding: 16px 48px;
            border: 3px solid #ffe438;
            background: transparent;
            color: #ffe438;
            border-radius: 50px;
            cursor: pointer;
            transition: all .25s;
            text-transform: uppercase;
        }
        #playBtn:hover {
            background: #ffe438;
            color: #1a003a;
            box-shadow: 0 0 40px #ffe438;
            transform: scale(1.05);
        }

        #hints {
            margin-top: 20px;
            font-size: .95rem;
            color: rgba(255,255,255,.6);
            text-align: center;
            line-height: 1.9;
        }
        #hints strong { color: #ffe438; }

        /* ── DEKORASI LAMPU BLOCKER ── */
        .light-row {
            display: flex; gap: 12px;
            margin-bottom: 24px;
        }
        .bulb {
            width: 16px; height: 16px;
            border-radius: 50%;
            animation: blinkBulb 1.2s steps(1) infinite;
        }
        .bulb:nth-child(odd)  { background: #ff5050; animation-delay: 0s; }
        .bulb:nth-child(even) { background: #ffe438; animation-delay: .6s; }
        @keyframes blinkBulb { 0%,49% { opacity:1; } 50%,100% { opacity:.15; } }

        /* ── HUD DALAM GAME ── */
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            font-size: 32px; 
            color: rgba(255, 228, 56, 0.8);
            text-shadow: 0 0 8px #ffe438, 0 0 16px #ff6a00;
            z-index: 100; 
            pointer-events: none;
            display: none; 
            user-select: none;
            font-weight: bold;
            letter-spacing: 2px;
        }

        #hud {
            position: absolute; top: 14px; left: 50%;
            transform: translateX(-50%);
            z-index: 100; pointer-events: none;
            display: none;
            font-family: 'Boogaloo', cursive;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #ffe438;
            text-shadow: 0 0 12px #ff6a00;
        }

        #tooltip {
            position: absolute; bottom: 60px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,.7);
            border: 1px solid #ffe438;
            border-radius: 8px;
            padding: 8px 20px;
            font-size: .9rem;
            color: #ffe438;
            z-index: 100; pointer-events: none;
            display: none;
            letter-spacing: 1px;
        }

        #controls-hint {
            position: absolute; bottom: 14px; left: 50%;
            transform: translateX(-50%);
            font-size: .78rem;
            color: rgba(255,255,255,.4);
            z-index: 100; pointer-events: none;
            display: none;
            letter-spacing: 1px;
        }

        #mode-indicator {
            position: absolute; top: 14px; right: 14px;
            z-index: 100; pointer-events: none;
            display: none;
            font-size: .9rem;
            color: #ffe438;
            font-family: 'Boogaloo', cursive;
            letter-spacing: 1px;
            text-shadow: 0 0 12px #ff6a00;
        }
    </style>
</head>

let jumpVelocity = 0;
const GRAVITY = 0.01;
const JUMP_FORCE = 0.2;
const GROUND_LEVEL = 1.7;

document.addEventListener('keydown', e => {
    if (e.code==='KeyW') keys.w=true;
    if (e.code==='KeyA') keys.a=true;
    if (e.code==='KeyS') keys.s=true;
    if (e.code==='KeyD') keys.d=true;
    if (e.code==='Space') {
        e.preventDefault();
        keys.space=true;
        // Jump only if in normal mode and on ground
        if (!isFreeRoamMode && camera.position.y <= GROUND_LEVEL + 0.01) {
            jumpVelocity = JUMP_FORCE;
        }
    }
    if (e.code==='ControlLeft' || e.code==='ControlRight') keys.ctrl=true;
    if (e.code==='KeyH') {
        isFreeRoamMode = !isFreeRoamMode;
        jumpVelocity = 0;
    }
});
document.addEventListener('keyup', e => {
    if (e.code==='KeyW') keys.w=false;
    if (e.code==='KeyA') keys.a=false;
    if (e.code==='KeyS') keys.s=false;
    if (e.code==='KeyD') keys.d=false;
    if (e.code==='Space') keys.space=false;
    if (e.code==='ControlLeft' || e.code==='ControlRight') keys.ctrl=false;
});

// ════════════════════════════════════════════════════════
//  SISTEM KOLISI (AABB sederhana)
// ════════════════════════════════════════════════════════
// Setiap objek kolisi disimpan sebagai { cx, cz, rx, rz, label }
const colliders = [];

function addCollider(cx, cz, rx, rz, label='') {
    colliders.push({ cx, cz, rx, rz, label });
}

const PLAYER_R = 0.5; // radius silinder pemain

function resolveCollision(pos) {
    for (const c of colliders) {
        const dx = pos.x - c.cx;
        const dz = pos.z - c.cz;
        const ox = c.rx + PLAYER_R - Math.abs(dx);
        const oz = c.rz + PLAYER_R - Math.abs(dz);
        if (ox > 0 && oz > 0) {
            if (ox < oz) pos.x += dx < 0 ? -ox : ox;
            else         pos.z += dz < 0 ? -oz : oz;
        }
    }
}

// ════════════════════════════════════════════════════════

function makeStripeTexture(c1='#ff3366', c2='#ffffff', stripes=8, size=256) {
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    const sw = size / stripes;
    for (let i = 0; i < stripes; i++) {
        ctx.fillStyle = i % 2 === 0 ? c1 : c2;
        ctx.fillRect(i * sw, 0, sw, size);
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
}

function makeCheckerTexture(c1='#cc0033', c2='#ffe438', size=256, tiles=8) {
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    const s = size / tiles;
    for (let y = 0; y < tiles; y++) for (let x = 0; x < tiles; x++) {
        ctx.fillStyle = (x+y)%2===0 ? c1 : c2;
        ctx.fillRect(x*s, y*s, s, s);
    }
    return new THREE.CanvasTexture(canvas);
}

function makeLightBulbTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#111';
    ctx.fillRect(0,0,64,64);
    ctx.fillStyle = '#ffe438';
    ctx.beginPath(); ctx.arc(32,32,14,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(26,26,4,0,Math.PI*2); ctx.fill();
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
}

function makeGroundTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#3a2508';
    ctx.fillRect(0,0,512,512);
    // sawdust grain
    for (let i = 0; i < 8000; i++) {
        const x = Math.random()*512, y = Math.random()*512;
        const l = Math.random()*8+2;
        ctx.strokeStyle = `rgba(${180+Math.random()*40|0},${130+Math.random()*30|0},60,0.4)`;
        ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+l,y+l*0.3); ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(20,20);
    return tex;
}

(function buildStars() {
    const geo = new THREE.BufferGeometry();
    const count = 2000;
    const pos = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi   = Math.acos(2 * Math.random() - 1);
        const r     = 180 + Math.random() * 20;
        pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
        pos[i*3+1] = r * Math.cos(phi);
        pos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, sizeAttenuation: true });
    scene.add(new THREE.Points(geo, mat));
})();

const objectLabels = new Map();

document.addEventListener('mousedown', () => {
    if (!controls.isLocked) return;
    raycaster.setFromCamera(centerScreen, camera);
    const hits = raycaster.intersectObjects(scene.children, true);
    if (hits.length > 0) {
        const mesh = hits[0].object;
        if (mesh.isMesh) {
            // Check if carousel was clicked
            if (carousel && isChildOf(mesh, carousel)) {
                carouselSpinning = !carouselSpinning;
                console.log('Carousel spinning:', carouselSpinning);
            }
            
            // Check if fountain was clicked
            if (fountain && isChildOf(mesh, fountain)) {
                spawnFireworks(fountain.position.x, fountain.position.y + 5, fountain.position.z);
                console.log('Fireworks launched!');
            }
            
            // Flash effect
            const origEmissive = mesh.material.emissive?.getHex?.() ?? 0;
            mesh.material.emissive?.setHex(0xffffff);
            setTimeout(() => mesh.material.emissive?.setHex(origEmissive), 120);
        }
    }
});

// Helper function to check if an object is a child of a parent
function isChildOf(child, parent) {
    let current = child;
    while (current) {
        if (current === parent) return true;
        current = current.parent;
    }
    return false;
}

function spawnFireworks(x, y, z) {
    if (!balloonModel) return; // Model not loaded yet
    
    // Spawn multiple balloons
    const balloonCount = 8;
    for (let i = 0; i < balloonCount; i++) {
        // Deep clone the balloon model with materials
        const balloonClone = balloonModel.clone(true);
        
        // Set position
        const startX = x + (Math.random() - 0.5) * 2;
        const startY = y;
        const startZ = z + (Math.random() - 0.5) * 2;
        balloonClone.position.x = startX;
        balloonClone.position.y = startY;
        balloonClone.position.z = startZ;
        
        // Add random rotation for variety
        balloonClone.rotation.x = Math.random() * Math.PI * 2;
        balloonClone.rotation.y = Math.random() * Math.PI * 2;
        balloonClone.rotation.z = Math.random() * Math.PI * 2;
        
        // Add random scale variation
        const scale = 0.8 + Math.random() * 0.6;
        balloonClone.scale.set(scale, scale, scale);
        
        // Clone and apply materials to each mesh
        balloonClone.traverse(node => {
            if (node.isMesh) {
                // Clone the material for this instance
                if (node.material) {
                    node.material = node.material.clone();
                    node.material.emissive = new THREE.Color(FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)]);
                    node.material.emissiveIntensity = 0.5;
                    node.material.transparent = true;
                }
            }
        });
        
        scene.add(balloonClone);
        
        // Store balloon with animation data - floating upward
        const horizontalDrift = (Math.random() - 0.5) * 1.5;
        const horizontalZ = (Math.random() - 0.5) * 1.5;
        
        balloons.push({
            mesh: balloonClone,
            velocity: new THREE.Vector3(
                horizontalDrift,
                6 + Math.random() * 2, // Fast upward movement
                horizontalZ
            ),
            age: 0,
            life: 2// Longer lifespan
        });
    }
}
